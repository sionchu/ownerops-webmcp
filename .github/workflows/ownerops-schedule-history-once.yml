name: OwnerOps schedule history once
on:
  push:
    branches: [re0/ai-store-manager]
    paths: [.github/workflows/ownerops-schedule-history-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: re0/ai-store-manager
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch schedule history UI and CI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/ownerops-app.tsx')
          text = p.read_text()
          text = text.replace('import { useMemo, useState, type CSSProperties } from "react";', 'import { useEffect, useMemo, useState, type CSSProperties } from "react";', 1)
          anchor = 'import { scheduleActualWageVariance, scheduleCostSummary, scheduleDayRange, scheduledWageForShift } from "@/domain/schedule-cost";\n'
          if anchor not in text: raise SystemExit('schedule-cost import anchor missing')
          text = text.replace(anchor, anchor + 'import { scheduleHistoryState, type ScheduleHistoryWeek } from "@/domain/schedule-history";\n', 1)
          anchor2 = 'import { getMarketLocation, getMarketProfile } from "@/market/profiles";\n'
          if anchor2 not in text: raise SystemExit('market import anchor missing')
          text = text.replace(anchor2, anchor2 + 'import { storeIdForState } from "@/persistence/store-projection";\n', 1)

          month_pattern = re.compile(r'function MonthScheduleOverview\(.*?\n}\n\nfunction scheduleBusinessCopy', re.S)
          match = month_pattern.search(text)
          if not match: raise SystemExit('MonthScheduleOverview block missing')
          month_replacement = '''function shiftMonth(date: string, delta: number): string {\n  const anchor = new Date(`${date.slice(0, 7)}-15T12:00:00`);\n  anchor.setMonth(anchor.getMonth() + delta);\n  return dateOnly(anchor);\n}\n\nfunction historyModeLabel(locale: UiLocale, week: ScheduleHistoryWeek) {\n  if (week.source === "demo") return week.salesMode === "actual"\n    ? (locale === "ko" ? "DEMO · 실적" : locale === "ja" ? "DEMO · 実績" : locale === "es" ? "DEMO · REAL" : locale === "zh-CN" ? "DEMO · 实绩" : "DEMO · ACTUAL")\n    : (locale === "ko" ? "DEMO · 계획" : locale === "ja" ? "DEMO · 計画" : locale === "es" ? "DEMO · PLAN" : locale === "zh-CN" ? "DEMO · 计划" : "DEMO · PLAN");\n  return week.source.toUpperCase();\n}\n\nfunction MonthScheduleOverview({ state, locale, selectedDate, historyWeeks, currentWeekStart, onSelectWeek }: { state: AppState; locale: UiLocale; selectedDate: string; historyWeeks: ScheduleHistoryWeek[]; currentWeekStart: string; onSelectWeek: (date: string) => void }) {\n  const copy = getScheduleHierarchyCopy(locale);\n  return <div data-testid="schedule-month-overview" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(190px,1fr))", gap: 8, padding: "12px 14px", borderBottom: "1px solid var(--line)" }}>\n    {monthWeekStartsFor(selectedDate).map((weekStart) => {\n      const days = weekDatesFor(weekStart);\n      const historyWeek = historyWeeks.find((week) => week.weekStart === weekStart);\n      const weekState = weekStart === currentWeekStart ? state : historyWeek ? scheduleHistoryState(state, historyWeek) : null;\n      const summary = weekState ? scheduleCostSummary(weekState, weekRange(days)) : null;\n      const ratio = summary ? (historyWeek?.salesMode === "actual" && summary.actualSalesBasis > 0 ? summary.actualLaborRatio : summary.laborRatio) : 0;\n      const badge = weekStart === currentWeekStart ? "DB" : historyWeek ? historyModeLabel(locale, historyWeek) : null;\n      return <button type="button" disabled={!weekState} data-testid={`month-week-${weekStart}`} key={weekStart} onClick={() => weekState && onSelectWeek(weekStart)} style={{ textAlign: "left", border: "1px solid var(--line)", background: "var(--surface-strong)", borderRadius: 9, padding: 11, cursor: weekState ? "pointer" : "default", color: "inherit", opacity: weekState ? 1 : 0.55 }}>\n        <span style={{ display: "flex", justifyContent: "space-between", gap: 8, color: "var(--muted)", fontSize: 10, fontWeight: 750 }}><span>{copy.weekSummary}</span>{badge && <em style={{ fontStyle: "normal", letterSpacing: ".04em" }}>{badge}</em>}</span>\n        <strong style={{ display: "block", marginTop: 3 }}>{days[0].slice(5).replace("-", "/")}–{days[6].slice(5).replace("-", "/")}</strong>\n        {summary && summary.scheduledHours > 0 ? <><span style={{ display: "block", marginTop: 7, fontSize: 11 }}>{formatHours(locale, summary.scheduledHours)} h · {formatMoney(weekState!, locale, summary.salesBasis)}</span><small style={{ display: "block", marginTop: 3, color: "var(--muted)" }}>{formatPercent(locale, ratio)}</small></> : <small style={{ display: "block", marginTop: 8, color: "var(--faint)" }}>{copy.noSchedule}</small>}\n      </button>;\n    })}\n  </div>;\n}\n\nfunction scheduleBusinessCopy'''
          text = text[:match.start()] + month_replacement + text[match.end():]

          # ScheduleGrid: load read-only DB history and select the correct week state.
          old = '''  const [view, setView] = useState<ScheduleView>("week");\n  const [selectedDate, setSelectedDate] = useState(businessDate);\n  const weekDays = useMemo(() => weekDatesFor(selectedDate), [selectedDate]);\n  const hierarchy = getScheduleHierarchyCopy(locale);\n  const [selectedShiftId, setSelectedShiftId] = useState<string | null>(null);\n  const displayShifts = useMemo(() => state.preview ? applyChanges(state.shifts, state.preview.changes) : state.shifts, [state]);\n  const previewIds = new Set(state.preview?.changes.map((change) => change.shiftId) ?? []);\n  const previewKind = state.preview ? candidateStage(state) : null;\n  const previewTag = previewKind === "human-edit" ? ui.preview.humanEdit : previewKind === "reviewed" ? ui.preview.reviewed : ui.preview.agentProposal;\n  const selectedShift = displayShifts.find((item) => item.id === selectedShiftId) ?? null;\n  const activeDate = weekDays.includes(selectedDate) ? selectedDate : weekDays.includes(businessDate) ? businessDate : weekDays[0];\n  const visibleDays = view === "day" ? [activeDate] : weekDays;\n  const focusDay = state.incident ? shiftDay(state.shifts.find((item) => item.id === state.incident?.shiftId) ?? state.shifts[0]) : businessDate;\n  const heading = view === "month" ? hierarchy.monthTitle(formatDay(locale, selectedDate, { month: "long", year: "numeric" })) : view === "day" ? ui.schedule.dayTitle.replace("{date}", scheduleDayLabel(locale, activeDate)) : ui.schedule.weekTitle;\n'''
          new = '''  const [view, setView] = useState<ScheduleView>("week");\n  const [selectedDate, setSelectedDate] = useState(businessDate);\n  const [historyWeeks, setHistoryWeeks] = useState<ScheduleHistoryWeek[]>([]);\n  const weekDays = useMemo(() => weekDatesFor(selectedDate), [selectedDate]);\n  const currentWeekStart = weekDatesFor(businessDate)[0];\n  const selectedWeekStart = weekDays[0];\n  const historyWeek = historyWeeks.find((week) => week.weekStart === selectedWeekStart);\n  const historicalWeek = selectedWeekStart !== currentWeekStart;\n  const scheduleState = useMemo(() => historicalWeek\n    ? historyWeek ? scheduleHistoryState(state, historyWeek) : { ...state, shifts: [], sales: [], timeEntries: [], incident: null, preview: null, storePlan: null, business: { ...state.business, peakWindows: [] } }\n    : state, [historicalWeek, historyWeek, state]);\n  const hierarchy = getScheduleHierarchyCopy(locale);\n  const [selectedShiftId, setSelectedShiftId] = useState<string | null>(null);\n  const displayShifts = useMemo(() => scheduleState.preview ? applyChanges(scheduleState.shifts, scheduleState.preview.changes) : scheduleState.shifts, [scheduleState]);\n  const previewIds = new Set(scheduleState.preview?.changes.map((change) => change.shiftId) ?? []);\n  const previewKind = scheduleState.preview ? candidateStage(scheduleState) : null;\n  const previewTag = previewKind === "human-edit" ? ui.preview.humanEdit : previewKind === "reviewed" ? ui.preview.reviewed : ui.preview.agentProposal;\n  const selectedShift = historicalWeek ? null : displayShifts.find((item) => item.id === selectedShiftId) ?? null;\n  const activeDate = weekDays.includes(selectedDate) ? selectedDate : weekDays.includes(businessDate) ? businessDate : weekDays[0];\n  const visibleDays = view === "day" ? [activeDate] : weekDays;\n  const focusDay = historicalWeek ? "" : state.incident ? shiftDay(state.shifts.find((item) => item.id === state.incident?.shiftId) ?? state.shifts[0]) : businessDate;\n  const heading = view === "month" ? hierarchy.monthTitle(formatDay(locale, selectedDate, { month: "long", year: "numeric" })) : view === "day" ? ui.schedule.dayTitle.replace("{date}", scheduleDayLabel(locale, activeDate)) : ui.schedule.weekTitle;\n\n  useEffect(() => {\n    const controller = new AbortController();\n    const storeId = storeIdForState(state);\n    setHistoryWeeks([]);\n    void fetch(`/api/schedule-history?storeId=${encodeURIComponent(storeId)}&from=2026-06-29&to=2026-10-05`, { signal: controller.signal, cache: "no-store" })\n      .then(async (response) => response.ok ? response.json() as Promise<{ weeks?: ScheduleHistoryWeek[] }> : null)\n      .then((payload) => { if (!controller.signal.aborted) setHistoryWeeks(payload?.weeks ?? []); })\n      .catch((error) => { if (!(error instanceof DOMException && error.name === "AbortError")) setHistoryWeeks([]); });\n    return () => controller.abort();\n  }, [state.business.market, state.business.industry]);\n'''
          if text.count(old) != 1: raise SystemExit('ScheduleGrid state block mismatch')
          text = text.replace(old, new, 1)

          old_drop = '''  const onDrop = (event: React.DragEvent, workerId: string, day: string) => {\n    event.preventDefault();\n    const shiftId = event.dataTransfer.getData("text/ownerops-shift");\n    if (shiftId) runAction({ type: "reassign_shift", shiftId, workerId, targetDay: day });\n  };'''
          new_drop = '''  const onDrop = (event: React.DragEvent, workerId: string, day: string) => {\n    event.preventDefault();\n    if (historicalWeek) return;\n    const shiftId = event.dataTransfer.getData("text/ownerops-shift");\n    if (shiftId) runAction({ type: "reassign_shift", shiftId, workerId, targetDay: day });\n  };'''
          if text.count(old_drop) != 1: raise SystemExit('drop block mismatch')
          text = text.replace(old_drop, new_drop, 1)

          old_heading = '''          <div><span className="eyebrow">{marketScheduleContext(locale, profile.copy.scheduleContext, location)}</span><h1>{heading}</h1></div>'''
          new_heading = '''          <div><span className="eyebrow">{marketScheduleContext(locale, profile.copy.scheduleContext, location)}</span><div style={{ display: "flex", alignItems: "center", gap: 8 }}><h1>{heading}</h1>{view === "month" && <span style={{ display: "inline-flex", gap: 4 }}><button data-testid="schedule-prev-month" className="icon-button" disabled={selectedDate.slice(0, 7) <= "2026-07"} onClick={() => setSelectedDate(shiftMonth(selectedDate, -1))} aria-label="Previous month">‹</button><button data-testid="schedule-next-month" className="icon-button" disabled={selectedDate.slice(0, 7) >= "2026-09"} onClick={() => setSelectedDate(shiftMonth(selectedDate, 1))} aria-label="Next month">›</button></span>}{view !== "month" && historicalWeek && historyWeek && <span data-testid="schedule-history-mode" style={{ fontSize: 10, fontWeight: 800, color: "var(--muted)", border: "1px solid var(--line)", borderRadius: 999, padding: "3px 7px" }}>{historyModeLabel(locale, historyWeek)}</span>}</div></div>'''
          if text.count(old_heading) != 1: raise SystemExit('heading block mismatch')
          text = text.replace(old_heading, new_heading, 1)

          old_month_call = '''{view === "month" && <MonthScheduleOverview state={state} locale={locale} selectedDate={selectedDate} onSelectWeek={(date) => { setSelectedDate(date); setView("week"); }} />}'''
          new_month_call = '''{view === "month" && <MonthScheduleOverview state={state} locale={locale} selectedDate={selectedDate} historyWeeks={historyWeeks} currentWeekStart={currentWeekStart} onSelectWeek={(date) => { setSelectedDate(date); setView("week"); }} />}'''
          if text.count(old_month_call) != 1: raise SystemExit('month call mismatch')
          text = text.replace(old_month_call, new_month_call, 1)
          text = text.replace('{view !== "month" && <ScheduleCostSummaryStrip state={state} locale={locale} view={view} selectedDate={activeDate} weekDays={weekDays}/>}','{view !== "month" && <ScheduleCostSummaryStrip state={scheduleState} locale={locale} view={view} selectedDate={activeDate} weekDays={weekDays}/>} ',1)
          text = text.replace('{view !== "month" && <SchedulePlanCost state={state} locale={locale} weekDays={weekDays}/>}','{view !== "month" && !historicalWeek && <SchedulePlanCost state={state} locale={locale} weekDays={weekDays}/>} ',1)
          text = text.replace('const daySummary = scheduleCostSummary(state, scheduleDayRange(day), { scheduleBasis: "candidate" });','const daySummary = scheduleCostSummary(scheduleState, scheduleDayRange(day), { scheduleBasis: "candidate" });',1)
          text = text.replace('{state.workers.map((worker) => (','{scheduleState.workers.map((worker) => (',1)

          old_shift = '''{shifts.map((item) => { const isPreview = previewIds.has(item.id); return <button draggable key={item.id} className={`shift-chip ${isPreview ? `preview candidate-${previewKind}` : ""}`} onDragStart={(event) => { event.dataTransfer.setData("text/ownerops-shift", item.id); event.dataTransfer.effectAllowed = "move"; }} title={isPreview ? `${previewTag}` : ui.schedule.reassign} onClick={() => setSelectedShiftId(item.id)}>{isPreview && <small className="chip-tag">{previewTag}</small>}<strong className="shift-worker-name">{worker.name}</strong><span className="shift-time">{formatTime(item.start)}–{formatTime(item.end)}</span></button>; })}'''
          new_shift = '''{shifts.map((item) => { const isPreview = previewIds.has(item.id); return <button draggable={!historicalWeek} key={item.id} className={`shift-chip ${isPreview ? `preview candidate-${previewKind}` : ""}`} onDragStart={(event) => { if (historicalWeek) return; event.dataTransfer.setData("text/ownerops-shift", item.id); event.dataTransfer.effectAllowed = "move"; }} title={historicalWeek ? historyModeLabel(locale, historyWeek!) : isPreview ? `${previewTag}` : ui.schedule.reassign} onClick={() => !historicalWeek && setSelectedShiftId(item.id)}>{isPreview && <small className="chip-tag">{previewTag}</small>}<strong className="shift-worker-name">{worker.name}</strong><span className="shift-time">{formatTime(item.start)}–{formatTime(item.end)}</span></button>; })}'''
          if text.count(old_shift) != 1: raise SystemExit('shift button block mismatch')
          text = text.replace(old_shift, new_shift, 1)
          text = text.replace('{view !== "month" && <p className="drag-help">{ui.schedule.dragHelp}</p>}','{view !== "month" && !historicalWeek && <p className="drag-help">{ui.schedule.dragHelp}</p>}',1)
          text = text.replace('{view !== "month" && selectedShift && <ManualShiftEditor','{view !== "month" && !historicalWeek && selectedShift && <ManualShiftEditor',1)
          p.write_text(text)

          # CI applies migration 005.
          p = Path('.github/workflows/ci.yml')
          ci = p.read_text()
          old = '          psql -h 127.0.0.1 -U postgres -d ownerops_test -v ON_ERROR_STOP=1 -f supabase/migrations/004_owner_store_master_rls.sql\n'
          new = old + '          psql -h 127.0.0.1 -U postgres -d ownerops_test -v ON_ERROR_STOP=1 -f supabase/migrations/005_schedule_history.sql\n'
          if ci.count(old) != 1: raise SystemExit('CI migration anchor mismatch')
          p.write_text(ci.replace(old, new, 1))

          Path('tests/schedule-history.test.ts').write_text('''import { describe, expect, it } from "vitest";\nimport { createDemoState } from "@/domain/fixtures";\nimport { scheduleHistoryState, type ScheduleHistoryWeek } from "@/domain/schedule-history";\nimport { scheduleCostSummary } from "@/domain/schedule-cost";\n\ndescribe("schedule history read model", () => {\n  it("projects an archived week without contaminating the working StoreState", () => {\n    const base = createDemoState("coffee", "kr-seoul");\n    const shifts = base.shifts.map((shift) => ({ ...shift, id: `hist-${shift.id}`, start: shift.start.replace("2026-08-", "2026-07-"), end: shift.end.replace("2026-08-", "2026-07-") }));\n    const sales = (base.sales ?? []).map((sale) => ({ ...sale, id: `hist-${sale.id}`, date: sale.date.replace("2026-08-", "2026-07-"), itemSales: [] }));\n    const timeEntries = shifts.map((shift) => ({ id: `time-${shift.id}`, workerId: shift.workerId!, shiftId: shift.id, clockIn: shift.start, clockOut: shift.end, source: "demo" as const }));\n    const week: ScheduleHistoryWeek = { storeId: "demo-kr-seoul-coffee", weekStart: "2026-07-20", shifts, sales, timeEntries, source: "demo", salesMode: "actual" };\n    const projected = scheduleHistoryState(base, week);\n    expect(base.shifts[0].id).not.toMatch(/^hist-/);\n    expect(projected.shifts[0].id).toMatch(/^hist-/);\n    expect(projected.preview).toBeNull();\n    expect(projected.storePlan).toBeNull();\n    const summary = scheduleCostSummary(projected, { start: "2026-07-20T00:00:00", end: "2026-07-27T00:00:00" });\n    expect(summary.scheduledHours).toBeGreaterThan(0);\n    expect(summary.actualWage).toBeGreaterThan(0);\n    expect(summary.actualSalesBasis).toBeGreaterThan(0);\n  });\n});\n''')
          PY
      - name: Verify
        run: |
          npm ci
          npm test
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit verified history UI
        run: |
          git config user.name "OwnerOps CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ownerops-schedule-history-once.yml
          git add .github/workflows/ci.yml src tests supabase
          git commit -m "feat: add read-only three-month schedule history"
          git push origin HEAD:re0/ai-store-manager
