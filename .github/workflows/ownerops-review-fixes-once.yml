            'export type StoreDataProvenance = {\n  storeTruth: StoreTruthSource;\n  referenceEvidence: ReferenceEvidenceSource;\n  disclosure: string;\n  storeUpdatedAt?: string;\n  referenceObservedAt?: string;\n  referenceFetchedAt?: string;\n};')
          old_with = '''function withDataProvenance(state: AppState, storeTruth: StoreTruthSource, referenceEvidence: ReferenceEvidenceSource): AppState {
            return {
