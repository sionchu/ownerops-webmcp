          replace_once('src/state/app-state.tsx', old_with, new_with)
          replace_once('src/state/app-state.tsx',
            '          ? withDataProvenance(mergePersistenceProjection(current, payload.projection), "database", refs)',
            '          ? withDataProvenance(mergePersistenceProjection(current, payload.projection), "database", refs, { storeUpdatedAt: payload.projection.persistedAt })')
          replace_once('src/state/app-state.tsx',
            '        const merged = payload.references?.length ? mergeCachedReferences(current, payload.references) : current;\n        const next = withDataProvenance(merged, dataProvenance(current).storeTruth, referenceEvidence);',
            '        const merged = payload.references?.length ? mergeCachedReferences(current, payload.references) : current;\n        const timestamps = (payload.references ?? []).reduce((latest, reference) => ({\n          observed: !latest.observed || reference.observedAt > latest.observed ? reference.observedAt : latest.observed,\n          fetched: !latest.fetched || reference.fetchedAt > latest.fetched ? reference.fetchedAt : latest.fetched,\n        }), { observed: "", fetched: "" });\n        const next = withDataProvenance(merged, dataProvenance(current).storeTruth, referenceEvidence, { referenceObservedAt: timestamps.observed || undefined, referenceFetchedAt: timestamps.fetched || undefined });')

          Path('src/components/owner-navigation.tsx').write_text(r'''"use client";

          import type { MarketId } from "@/domain/model";
