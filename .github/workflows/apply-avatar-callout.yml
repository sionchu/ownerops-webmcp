name: Apply avatar callout and worker chip

on:
  push:
    branches:
      - feat/avatar-callout-worker-chip

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/avatar-callout-worker-chip
      - name: Apply focused UI patch
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/components/ownerops-app.tsx')
          text = app.read_text()
          old = '''  const activity = ui.activity[state.activity.state];\n  const activityDetail = state.activity.state === "warning" && incidentWorker\n'''
          new = '''  const activity = ui.activity[state.activity.state];\n  const showAvatarCallout = ["warning", "proposalReady", "reviewNeeded", "reviewed", "applied"].includes(state.activity.state);\n  const activityDetail = state.activity.state === "warning" && incidentWorker\n'''
          if old not in text:
              raise SystemExit('activity anchor not found')
          text = text.replace(old, new, 1)

          old = '''      <AssistantAvatar state={state.activity.state} accessory={profile.visual.avatarAccessory} detail={profile.visual.avatarDetail} />\n      <div className={`activity-copy activity-${state.activity.state}`} aria-live="polite"><span className="activity-kicker">{activity.kicker}</span><strong>{activity.message}</strong>{activityDetail && <p>{activityDetail}</p>}</div>\n'''
          new = '''      <div className={`assistant-avatar-stage ${showAvatarCallout ? "has-callout" : ""}`}>\n        {showAvatarCallout && <div className={`activity-copy avatar-callout activity-${state.activity.state}`} aria-live="polite"><span className="activity-kicker">{activity.kicker}</span><strong>{activity.message}</strong>{activityDetail && <p>{activityDetail}</p>}</div>}\n        <AssistantAvatar state={state.activity.state} accessory={profile.visual.avatarAccessory} detail={profile.visual.avatarDetail} />\n      </div>\n      {!showAvatarCallout && <div className={`activity-copy activity-${state.activity.state}`} aria-live="polite"><span className="activity-kicker">{activity.kicker}</span><strong>{activity.message}</strong>{activityDetail && <p>{activityDetail}</p>}</div>}\n'''
          if old not in text:
              raise SystemExit('avatar activity block not found')
          text = text.replace(old, new, 1)

          old = '''>{isPreview && <small className="chip-tag">{previewTag}</small>}<span>{formatTime(item.start)}–{formatTime(item.end)}</span><small>{profile.roleLabels[item.role]}</small></button>; })}'''
          new = '''>{isPreview && <small className="chip-tag">{previewTag}</small>}<strong className="shift-worker-name">{worker.name}</strong><span className="shift-time">{formatTime(item.start)}–{formatTime(item.end)}</span></button>; })}'''
          if old not in text:
              raise SystemExit('shift chip block not found')
          text = text.replace(old, new, 1)
          app.write_text(text)

          css = Path('src/styles/locale-timeline.css')
          css_text = css.read_text()
          marker = '/* Avatar callout + assignment-first schedule chips. */'
          if marker not in css_text:
              css_text += '''\n\n/* Avatar callout + assignment-first schedule chips. */\n.assistant-avatar-stage { position: relative; display: grid; justify-items: center; }\n.assistant-avatar-stage.has-callout { margin-top: 14px; }\n.assistant-avatar-stage.has-callout .avatar { margin: 10px auto 8px; }\n.avatar-callout { position: relative; width: 100%; min-height: 0; padding: 10px 12px; border-radius: var(--oo-radius-card); box-shadow: 0 8px 20px rgb(20 20 20 / .06); overflow-wrap: anywhere; animation: avatar-callout-in 180ms var(--oo-ease-standard) both; }\n.avatar-callout::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 9px; height: 9px; transform: translateX(-50%) rotate(45deg); background: inherit; border-right: 1px solid var(--oo-border, var(--line)); border-bottom: 1px solid var(--oo-border, var(--line)); }\n.avatar-callout.activity-warning { border-color: color-mix(in srgb, var(--warning) 38%, var(--line)); background: color-mix(in srgb, var(--warning-soft) 72%, var(--oo-surface)); }\n.avatar-callout .activity-kicker { margin-bottom: 4px; }\n.avatar-callout strong { font-size: 12px; }\n.avatar-callout p { margin-top: 4px; }\n.shift-chip .shift-worker-name { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; line-height: 1.2; }\n.shift-chip .shift-time { margin-top: 3px; color: #60766d; font-size: 9px; font-weight: 650; line-height: 1.2; }\n.shift-chip.candidate-human-edit .shift-time { color: #80613f; }\n@keyframes avatar-callout-in { from { opacity: .45; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }\n'''
          css.write_text(css_text)
          PY
      - name: Commit UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ownerops-app.tsx src/styles/locale-timeline.css
          git commit -m "feat: add localized avatar callouts and worker names"
          git push origin HEAD:feat/avatar-callout-worker-chip
