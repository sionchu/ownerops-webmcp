name: OwnerOps review patch run
on:
  push:
    branches: [re0/ai-store-manager]
    paths: [.github/workflows/ownerops-review-patch-run.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: re0/ai-store-manager
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/apply_review_ux_patch.py
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name "OwnerOps CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ownerops-review-patch-run.yml scripts/apply_review_ux_patch.py
          git add src scripts tests
          git commit -m "feat: clarify evidence and schedule hierarchy"
          git push origin HEAD:re0/ai-store-manager
