name: OwnerOps review UX once

on:
  push:
    branches: [re0/ai-store-manager]
    paths: [.github/workflows/ownerops-review-ux-once.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: re0/ai-store-manager
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply evidence, schedule hierarchy, and WebMCP routing fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def one(path, old, new):
              p = Path(path); text = p.read_text(); n = text.count(old)
              if n != 1: raise SystemExit(f"{path}: expected 1 match, got {n}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1))

          def sub1(path, pattern, repl, flags=0):
              p = Path(path); text = p.read_text(); new, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1: raise SystemExit(f"{path}: regex expected 1 match, got {n}: {pattern[:90]!r}")
              p.write_text(new)

          Path('src/i18n/evidence.ts').write_text('''import type { ReferenceObservation } from "@/domain/model";
          import { INTL_LOCALE, type UiLocale } from "@/i18n";

          export type EvidenceState = "db" | "live" | "recent" | "cached" | "benchmark" | "stale" | "missing" | "demo";
          type Copy = { data: string; operation: string; states: Record<EvidenceState, string>; observed: string; fetched: string; stored: string; salesEvidence: string; dailySales: string; menuMix: string; source: string; date: string; netSales: string; orders: string; soldQty: string; foodCost: string; foodCostRatio: string; wasteCost: string; lossRate: string; reconciliation: string };
          const COPY: Record<UiLocale, Copy> = {
            en: { data: "Data", operation: "Operation", states: { db: "DB", live: "LIVE", recent: "RECENT", cached: "CACHE", benchmark: "BENCH", stale: "STALE", missing: "—", demo: "DEMO" }, observed: "Observed", fetched: "Fetched", stored: "Stored", salesEvidence: "Sales evidence", dailySales: "Daily sales", menuMix: "Menu mix", source: "Source", date: "Date", netSales: "Net sales", orders: "Orders", soldQty: "Sold", foodCost: "Food cost", foodCostRatio: "Food cost %", wasteCost: "Waste cost", lossRate: "Loss %", reconciliation: "Unallocated sales" },
            ko: { data: "데이터", operation: "운영", states: { db: "DB", live: "LIVE", recent: "최근", cached: "CACHE", benchmark: "기준", stale: "오래됨", missing: "—", demo: "DEMO" }, observed: "관측", fetched: "수집", stored: "저장", salesEvidence: "매출 근거", dailySales: "일별 매출", menuMix: "메뉴 판매", source: "출처", date: "일자", netSales: "순매출", orders: "주문", soldQty: "판매수량", foodCost: "식재료비", foodCostRatio: "식재료비율", wasteCost: "로스 비용", lossRate: "로스율", reconciliation: "미배분 매출" },
            ja: { data: "データ", operation: "運営", states: { db: "DB", live: "LIVE", recent: "直近", cached: "CACHE", benchmark: "基準", stale: "古い", missing: "—", demo: "DEMO" }, observed: "観測", fetched: "取得", stored: "保存", salesEvidence: "売上根拠", dailySales: "日別売上", menuMix: "メニュー販売", source: "出典", date: "日付", netSales: "純売上", orders: "注文", soldQty: "販売数", foodCost: "食材費", foodCostRatio: "食材費率", wasteCost: "ロス費用", lossRate: "ロス率", reconciliation: "未配分売上" },
            es: { data: "Datos", operation: "Operación", states: { db: "DB", live: "LIVE", recent: "RECIENTE", cached: "CACHE", benchmark: "REF", stale: "ANTIGUO", missing: "—", demo: "DEMO" }, observed: "Observado", fetched: "Recogido", stored: "Guardado", salesEvidence: "Evidencia de ventas", dailySales: "Ventas diarias", menuMix: "Venta por menú", source: "Fuente", date: "Fecha", netSales: "Ventas netas", orders: "Pedidos", soldQty: "Vendidos", foodCost: "Coste comida", foodCostRatio: "% coste", wasteCost: "Merma", lossRate: "% merma", reconciliation: "Venta no asignada" },
            "zh-CN": { data: "数据", operation: "运营", states: { db: "DB", live: "LIVE", recent: "近期", cached: "CACHE", benchmark: "基准", stale: "过期", missing: "—", demo: "DEMO" }, observed: "观测", fetched: "采集", stored: "保存", salesEvidence: "销售依据", dailySales: "每日销售", menuMix: "菜单销售", source: "来源", date: "日期", netSales: "净销售额", orders: "订单", soldQty: "销量", foodCost: "食材成本", foodCostRatio: "食材成本率", wasteCost: "损耗成本", lossRate: "损耗率", reconciliation: "未分配销售额" },
          };
          export function getEvidenceCopy(locale: UiLocale) { return COPY[locale]; }
          export function referenceEvidenceState(reference: ReferenceObservation | null | undefined): EvidenceState {
            if (!reference) return "missing";
            if (reference.provider === "fnb-master-2026" || reference.freshness === "seed") return "benchmark";
            if (reference.freshness === "live") return "live";
            if (reference.freshness === "recent") return "recent";
            if (reference.freshness === "cached") return "cached";
            return "stale";
          }
          export function formatEvidenceTime(locale: UiLocale, value: string | undefined): string {
            if (!value) return "—";
            const date = new Date(value);
            if (!Number.isFinite(date.getTime())) return value.slice(0, 16).replace("T", " ");
            return new Intl.DateTimeFormat(INTL_LOCALE[locale], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }).format(date);
          }
          ''')

          Path('src/i18n/schedule-hierarchy.ts').write_text('''import type { UiLocale } from "@/i18n";
          const COPY: Record<UiLocale, { month: string; monthTitle: (label: string) => string; weekSummary: string; noSchedule: string; startTime: string; endTime: string; invalidTime: string }> = {
            en: { month: "Month", monthTitle: (label) => `${label} · weekly overview`, weekSummary: "Week", noSchedule: "No DB schedule", startTime: "Start", endTime: "End", invalidTime: "End time must be after start time." },
            ko: { month: "월간", monthTitle: (label) => `${label} · 주간 현황`, weekSummary: "주간", noSchedule: "DB 스케줄 없음", startTime: "시작", endTime: "종료", invalidTime: "종료 시간은 시작 시간보다 늦어야 합니다." },
            ja: { month: "月間", monthTitle: (label) => `${label} · 週間概要`, weekSummary: "週", noSchedule: "DBスケジュールなし", startTime: "開始", endTime: "終了", invalidTime: "終了時刻は開始時刻より後にしてください。" },
            es: { month: "Mes", monthTitle: (label) => `${label} · resumen semanal`, weekSummary: "Semana", noSchedule: "Sin horario DB", startTime: "Inicio", endTime: "Fin", invalidTime: "La hora de fin debe ser posterior al inicio." },
            "zh-CN": { month: "月", monthTitle: (label) => `${label} · 周概览`, weekSummary: "周", noSchedule: "无 DB 排班", startTime: "开始", endTime: "结束", invalidTime: "结束时间必须晚于开始时间。" },
          };
          export function getScheduleHierarchyCopy(locale: UiLocale) { return COPY[locale]; }
          ''')

          Path('src/domain/sales-evidence.ts').write_text('''import type { AppState } from "./model";
          import { menuUnitFoodCost } from "./store-ops";
          import { convertInventoryQuantity } from "./units";
          const sum = (values: number[]) => values.reduce((total, value) => total + value, 0);
          function wasteCostForDate(state: AppState, date: string): number {
            const inventory = new Map((state.inventory ?? []).map((item) => [item.id, item]));
            return sum((state.waste ?? []).filter((record) => record.recordedAt.slice(0, 10) === date).map((record) => {
              const item = inventory.get(record.inventoryItemId);
              if (!item || item.lastPurchaseUnitCost == null) return 0;
              const quantity = convertInventoryQuantity(record.quantity, record.unit, item.unit);
              return quantity == null ? 0 : quantity * item.lastPurchaseUnitCost;
            }));
          }
          export function analyzeSalesEvidence(state: AppState) {
            const menu = new Map((state.menu ?? []).map((item) => [item.id, item]));
            const daily = (state.sales ?? []).map((snapshot) => {
              const recordedItemSales = sum(snapshot.itemSales.map((item) => item.netSales));
              const theoreticalFoodCost = sum(snapshot.itemSales.map((sold) => { const item = menu.get(sold.menuItemId); return item ? sold.quantity * menuUnitFoodCost(state, item) : 0; }));
              const wasteCost = wasteCostForDate(state, snapshot.date);
              return { date: snapshot.date, source: snapshot.source, netSales: snapshot.netSales, orderCount: snapshot.orderCount, recordedItemSales, unallocatedSales: snapshot.netSales - recordedItemSales, theoreticalFoodCost, foodCostRatio: snapshot.netSales > 0 ? theoreticalFoodCost / snapshot.netSales : 0, wasteCost, lossRate: theoreticalFoodCost > 0 ? wasteCost / theoreticalFoodCost : 0 };
            });
            const menuEvidence = (state.menu ?? []).map((item) => {
              const lines = (state.sales ?? []).flatMap((snapshot) => snapshot.itemSales.filter((line) => line.menuItemId === item.id));
              const quantity = sum(lines.map((line) => line.quantity)); const netSales = sum(lines.map((line) => line.netSales)); const foodCost = quantity * menuUnitFoodCost(state, item);
              return { menuItemId: item.id, name: item.name, quantity, netSales, foodCost, foodCostRatio: netSales > 0 ? foodCost / netSales : null };
            }).filter((item) => item.quantity > 0).sort((a, b) => b.netSales - a.netSales);
            return { daily, menu: menuEvidence, totals: { netSales: sum(daily.map((item) => item.netSales)), recordedItemSales: sum(daily.map((item) => item.recordedItemSales)), unallocatedSales: sum(daily.map((item) => item.unallocatedSales)), theoreticalFoodCost: sum(daily.map((item) => item.theoreticalFoodCost)), wasteCost: sum(daily.map((item) => item.wasteCost)) } };
          }
          ''')

          # Provenance timestamps stay in semantic state; UI remains compact/tooltips only.
          one('src/state/app-state.tsx', '  disclosure: string;\n};', '  disclosure: string;\n  storeUpdatedAt?: string;\n  referenceObservedAt?: string;\n  referenceFetchedAt?: string;\n};')
          sub1('src/state/app-state.tsx', r'function withDataProvenance\(state: AppState, storeTruth: StoreTruthSource, referenceEvidence: ReferenceEvidenceSource\): AppState \{[\s\S]*?\n\}', '''function withDataProvenance(state: AppState, storeTruth: StoreTruthSource, referenceEvidence: ReferenceEvidenceSource, timestamps: Partial<Pick<StoreDataProvenance, "storeUpdatedAt" | "referenceObservedAt" | "referenceFetchedAt">> = {}): AppState {
            const previous = (state.business as RuntimeBusiness).dataProvenance;
            return { ...state, business: { ...state.business, dataProvenance: { storeTruth, referenceEvidence, disclosure: provenanceDisclosure(storeTruth, referenceEvidence), storeUpdatedAt: timestamps.storeUpdatedAt ?? previous?.storeUpdatedAt, referenceObservedAt: timestamps.referenceObservedAt ?? previous?.referenceObservedAt, referenceFetchedAt: timestamps.referenceFetchedAt ?? previous?.referenceFetchedAt } } as AppState["business"] };
          }''')
          one('src/state/app-state.tsx', '? withDataProvenance(mergePersistenceProjection(current, payload.projection), "database", refs)', '? withDataProvenance(mergePersistenceProjection(current, payload.projection), "database", refs, { storeUpdatedAt: payload.projection.persistedAt })')
          one('src/state/app-state.tsx', '        const merged = payload.references?.length ? mergeCachedReferences(current, payload.references) : current;\n        const next = withDataProvenance(merged, dataProvenance(current).storeTruth, referenceEvidence);', '        const merged = payload.references?.length ? mergeCachedReferences(current, payload.references) : current;\n        const latest = (payload.references ?? []).reduce((acc, reference) => ({ observed: !acc.observed || reference.observedAt > acc.observed ? reference.observedAt : acc.observed, fetched: !acc.fetched || reference.fetchedAt > acc.fetched ? reference.fetchedAt : acc.fetched }), { observed: "", fetched: "" });\n        const next = withDataProvenance(merged, dataProvenance(current).storeTruth, referenceEvidence, { referenceObservedAt: latest.observed || undefined, referenceFetchedAt: latest.fetched || undefined });')

          # Compact provenance icon tooltips include timestamps, not paragraphs.
          nav = Path('src/components/owner-navigation.tsx').read_text()
          nav = nav.replace('import { getStoreSurfaceCopy } from "@/i18n/store-surface";', 'import { formatEvidenceTime, getEvidenceCopy } from "@/i18n/evidence";\nimport { getStoreSurfaceCopy } from "@/i18n/store-surface";')
          nav = nav.replace('  const ui = getStoreSurfaceCopy(locale);', '  const ui = getStoreSurfaceCopy(locale);\n  const evidenceUi = getEvidenceCopy(locale);')
          nav = nav.replace('  const referenceBenchmark = referenceMode === "database-benchmark-cache";', '  const referenceBenchmark = referenceMode === "database-benchmark-cache";\n  const storeTitle = storeLive ? `${evidenceUi.states.db} · ${evidenceUi.stored} ${formatEvidenceTime(locale, provenance?.storeUpdatedAt)}` : evidenceUi.states.demo;\n  const referenceTitle = `${referenceProvider ? evidenceUi.states.cached : referenceBenchmark ? evidenceUi.states.benchmark : evidenceUi.states.demo} · ${evidenceUi.observed} ${formatEvidenceTime(locale, provenance?.referenceObservedAt)} · ${evidenceUi.fetched} ${formatEvidenceTime(locale, provenance?.referenceFetchedAt)}`;')
          nav = nav.replace('title={storeLive ? "매장 데이터 · DB" : "매장 데이터 · Demo"}', 'title={storeTitle}')
          nav = nav.replace('title={referenceProvider ? "시장 참고 · Provider cache" : referenceBenchmark ? "시장 참고 · Benchmark" : "시장 참고 · Demo"}', 'title={referenceTitle}')
          Path('src/components/owner-navigation.tsx').write_text(nav)

          # Shift action supports start/end as well as person/day.
          one('src/domain/actions.ts', 'import { applyChanges, calculateImpact } from "./impact";', 'import { applyChanges, calculateImpact, hoursBetween } from "./impact";')
          one('src/domain/actions.ts', '| { type: "reassign_shift"; shiftId: string; workerId: string; targetDay?: string }', '| { type: "reassign_shift"; shiftId: string; workerId: string; targetDay?: string; start?: string; end?: string }')
          one('src/domain/actions.ts', '      const movedTime = action.targetDay ? shiftToDay(candidateCurrent.start, candidateCurrent.end, action.targetDay) : { start: candidateCurrent.start, end: candidateCurrent.end };', '      const movedDay = action.targetDay ? shiftToDay(candidateCurrent.start, candidateCurrent.end, action.targetDay) : { start: candidateCurrent.start, end: candidateCurrent.end };\n      const movedTime = { start: action.start ?? movedDay.start, end: action.end ?? movedDay.end };\n      const duration = hoursBetween(movedTime.start, movedTime.end);\n      if (movedTime.start.slice(0, 10) !== movedTime.end.slice(0, 10) || !Number.isFinite(duration) || duration <= 0 || duration > 18) throw new Error("Shift start/end must form a valid same-day interval.");')

          # Month -> Week -> Day schedule hierarchy.
          one('src/components/ownerops-app.tsx', 'import { getMarketLocation, getMarketProfile } from "@/market/profiles";\n', 'import { getMarketLocation, getMarketProfile } from "@/market/profiles";\nimport { getScheduleHierarchyCopy } from "@/i18n/schedule-hierarchy";\n')
          one('src/components/ownerops-app.tsx', 'type ScheduleView = "day" | "week";', 'type ScheduleView = "month" | "week" | "day";')
          marker = 'function ScheduleCostSummaryStrip('
          app = Path('src/components/ownerops-app.tsx').read_text()
          idx = app.index(marker)
          helpers = '''function monthWeekStartsFor(date: string): string[] {
            const anchor = new Date(`${date.slice(0, 7)}-01T12:00:00`);
            const month = anchor.getMonth(); anchor.setDate(anchor.getDate() - ((anchor.getDay() + 6) % 7));
            return Array.from({ length: 6 }, (_, index) => { const week = new Date(anchor); week.setDate(anchor.getDate() + index * 7); return dateOnly(week); }).filter((week, index) => index === 0 || new Date(`${week}T12:00:00`).getMonth() === month || new Date(`${week}T12:00:00`).getDate() <= 7);
          }

          function MonthScheduleOverview({ state, locale, selectedDate, onSelectWeek }: { state: AppState; locale: UiLocale; selectedDate: string; onSelectWeek: (date: string) => void }) {
            const copy = getScheduleHierarchyCopy(locale);
            return <div data-testid="schedule-month-overview" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(190px,1fr))", gap: 8, padding: "12px 14px", borderBottom: "1px solid var(--line)" }}>{monthWeekStartsFor(selectedDate).map((weekStart) => { const days = weekDatesFor(weekStart); const summary = scheduleCostSummary(state, weekRange(days), { scheduleBasis: "candidate" }); return <button type="button" data-testid={`month-week-${weekStart}`} key={weekStart} onClick={() => onSelectWeek(weekStart)} style={{ textAlign: "left", border: "1px solid var(--line)", background: "var(--surface-strong)", borderRadius: 9, padding: 11, cursor: "pointer", color: "inherit" }}><span style={{ display: "block", color: "var(--muted)", fontSize: 10, fontWeight: 750 }}>{copy.weekSummary}</span><strong style={{ display: "block", marginTop: 3 }}>{days[0].slice(5).replace("-", "/")}–{days[6].slice(5).replace("-", "/")}</strong>{summary.scheduledHours > 0 ? <><span style={{ display: "block", marginTop: 7, fontSize: 11 }}>{formatHours(locale, summary.scheduledHours)} h · {formatMoney(state, locale, summary.scheduledWage)}</span><small style={{ display: "block", marginTop: 3, color: "var(--muted)" }}>{formatMoney(state, locale, summary.salesBasis)} · {summary.warningCount} ⚑</small></> : <small style={{ display: "block", marginTop: 8, color: "var(--faint)" }}>{copy.noSchedule}</small>}</button>; })}</div>;
          }

          '''
          app = app[:idx] + helpers + app[idx:]
          Path('src/components/ownerops-app.tsx').write_text(app)
          sub1('src/components/ownerops-app.tsx', r'  const businessDate = state\.context\?\.businessDate \?\? DEMO_WEEK\[4\];\n  const weekDays = useMemo\(\(\) => weekDatesFor\(businessDate\), \[businessDate\]\);\n  const \[view, setView\] = useState<ScheduleView>\("week"\);\n  const \[selectedDate, setSelectedDate\] = useState\(businessDate\);', '  const businessDate = state.context?.businessDate ?? DEMO_WEEK[4];\n  const [view, setView] = useState<ScheduleView>("week");\n  const [selectedDate, setSelectedDate] = useState(businessDate);\n  const weekDays = useMemo(() => weekDatesFor(selectedDate), [selectedDate]);\n  const hierarchy = getScheduleHierarchyCopy(locale);')
          one('src/components/ownerops-app.tsx', '  const heading = view === "day" ? ui.schedule.dayTitle.replace("{date}", scheduleDayLabel(locale, activeDate)) : ui.schedule.weekTitle;', '  const heading = view === "month" ? hierarchy.monthTitle(formatDay(locale, selectedDate, { month: "long", year: "numeric" })) : view === "day" ? ui.schedule.dayTitle.replace("{date}", scheduleDayLabel(locale, activeDate)) : ui.schedule.weekTitle;')
          sub1('src/components/ownerops-app.tsx', r'<div className="schedule-view-toggle" role="group" aria-label=\{ui\.schedule\.viewSelector\}>\s*<button[^>]*view === "day"[\s\S]*?</button>\s*<button[^>]*view === "week"[\s\S]*?</button>\s*</div>', '<div className="schedule-view-toggle" role="group" aria-label={ui.schedule.viewSelector}><button data-testid="schedule-view-month" type="button" aria-pressed={view === "month"} className={view === "month" ? "active" : ""} onClick={() => setView("month")}>{hierarchy.month}</button><button data-testid="schedule-view-week" type="button" aria-pressed={view === "week"} className={view === "week" ? "active" : ""} onClick={() => setView("week")}>{ui.schedule.week}</button><button data-testid="schedule-view-day" type="button" aria-pressed={view === "day"} className={view === "day" ? "active" : ""} onClick={() => setView("day")}>{ui.schedule.day}</button></div>')
          one('src/components/ownerops-app.tsx', '      {view === "day" && <div className="schedule-day-picker"', '      {view === "month" && <MonthScheduleOverview state={state} locale={locale} selectedDate={selectedDate} onSelectWeek={(date) => { setSelectedDate(date); setView("week"); }} />}\n      {view === "day" && <div className="schedule-day-picker"')
          one('src/components/ownerops-app.tsx', '      <ScheduleCostSummaryStrip state={state} locale={locale} view={view} selectedDate={activeDate} weekDays={weekDays}/>', '      {view !== "month" && <ScheduleCostSummaryStrip state={state} locale={locale} view={view} selectedDate={activeDate} weekDays={weekDays}/>}')
          one('src/components/ownerops-app.tsx', '      <SchedulePlanCost state={state} locale={locale} weekDays={weekDays}/>', '      {view !== "month" && <SchedulePlanCost state={state} locale={locale} weekDays={weekDays}/>}')
          one('src/components/ownerops-app.tsx', '      <div className="schedule-scroll">', '      <div className="schedule-scroll" style={{ display: view === "month" ? "none" : undefined }}>')
          one('src/components/ownerops-app.tsx', '      <p className="drag-help">{ui.schedule.dragHelp}</p>', '      {view !== "month" && <p className="drag-help">{ui.schedule.dragHelp}</p>}')
          one('src/components/ownerops-app.tsx', 'return <div key={day} className={`day-head ${day === focusDay ? "focus-day" : ""}`}><strong>', 'return <button type="button" key={day} onClick={() => { setSelectedDate(day); setView("day"); }} className={`day-head ${day === focusDay ? "focus-day" : ""}`} style={{ border: 0, font: "inherit", cursor: "pointer", color: "inherit" }}><strong>')
          one('src/components/ownerops-app.tsx', '{day === focusDay && state.incident && <em>{profile.copy.incidentLabel}</em>}</div>;', '{day === focusDay && state.incident && <em>{profile.copy.incidentLabel}</em>}</button>;')
          one('src/components/ownerops-app.tsx', '      {selectedShift && <ManualShiftEditor key={selectedShift.id} shift={selectedShift} onClose={() => setSelectedShiftId(null)} onSave={(workerId, targetDay) => { runAction({ type: "reassign_shift", shiftId: selectedShift.id, workerId, targetDay }); setSelectedShiftId(null); }} />}', '      {view !== "month" && selectedShift && <ManualShiftEditor key={selectedShift.id} shift={selectedShift} onClose={() => setSelectedShiftId(null)} onSave={(workerId, targetDay, startTime, endTime) => { runAction({ type: "reassign_shift", shiftId: selectedShift.id, workerId, targetDay, start: `${targetDay}T${startTime}:00`, end: `${targetDay}T${endTime}:00` }); setSelectedShiftId(null); }} />}')
          sub1('src/components/ownerops-app.tsx', r'function ManualShiftEditor\([\s\S]*?\n\}\n\nfunction ScenarioPanel\(\) \{', '''function ManualShiftEditor({ shift, onClose, onSave }: { shift: Shift; onClose: () => void; onSave: (workerId: string, targetDay: string, startTime: string, endTime: string) => void }) {
            const { state, locale } = useAppState(); const ui = getUiCopy(locale); const hierarchy = getScheduleHierarchyCopy(locale); const profile = getLocalizedIndustryProfile(getIndustryProfile(state.business.industry), locale);
            const [workerId, setWorkerId] = useState(shift.workerId ?? state.workers[0].id); const [targetDay, setTargetDay] = useState(shiftDay(shift)); const [startTime, setStartTime] = useState(formatTime(shift.start)); const [endTime, setEndTime] = useState(formatTime(shift.end)); const validTime = endTime > startTime;
