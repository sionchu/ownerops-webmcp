name: Apply live operating summary source patch

on:
  push:
    branches:
      - feat/live-operating-summary

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply live operating summary patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/live-operating-summary
      - name: Patch OwnerOps header
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/ownerops-app.tsx')
          text = path.read_text()

          old_import = 'import { disruptionBody, markUnavailableLabel, marketScheduleContext, minimumWageLabel, suggestedIncidentPrompt, unavailableLabel } from "@/i18n/dynamic";'
          new_import = 'import { disruptionBody, liveOperatingSummary, markUnavailableLabel, marketScheduleContext, minimumWageLabel, suggestedIncidentPrompt, unavailableLabel } from "@/i18n/dynamic";'
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old_state = 'const { state, impact, previewImpact, hydrated, runAction, locale } = useAppState();'
          new_state = 'const { state, impact, previewImpact, scenarios, hydrated, runAction, locale } = useAppState();'
          assert old_state in text
          text = text.replace(old_state, new_state, 1)

          old_impact = '  const visibleImpact = previewImpact ?? impact;\n  return ('
          new_impact = '''  const visibleImpact = previewImpact ?? impact;
          const operatingSummary = liveOperatingSummary(locale, {
            activityState: state.activity.state,
            hasIncident: Boolean(state.incident),
            hasPreview: Boolean(state.preview),
            optionCount: scenarios.length,
            uncoveredPeakMinutes: visibleImpact.uncoveredPeakMinutes,
            warningCount: visibleImpact.warnings.length,
            laborRatio: visibleImpact.laborRatio,
            incidentWindow: ui.timeline.fridayGap,
          });
          return ('''
          assert old_impact in text
          text = text.replace(old_impact, new_impact, 1)

          old_shell = 'data-market={state.business.market} style={{'
          new_shell = 'data-market={state.business.market} data-operating-tone={operatingSummary.tone} style={{'
          assert old_shell in text
          text = text.replace(old_shell, new_shell, 1)

          old_header = '<h1>{profile.copy.headline}</h1><p>{marketScheduleContext(locale, profile.copy.scheduleContext, location)}</p>'
          new_header = '<h1>{operatingSummary.headline}</h1><p>{operatingSummary.detail}</p>'
          assert old_header in text
          text = text.replace(old_header, new_header, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ownerops-app.tsx
          git commit -m "chore: apply live operating summary patch"
          git push origin HEAD:feat/live-operating-summary
