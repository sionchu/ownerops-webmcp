name: Apply live operating summary source patch

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/live-operating-summary
      - name: Patch OwnerOps header
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/ownerops-app.tsx')
          text = path.read_text()

          if 'liveOperatingSummary' in text:
              raise SystemExit(0)

          replacements = [
            (
              'import { disruptionBody, markUnavailableLabel, marketScheduleContext, minimumWageLabel, suggestedIncidentPrompt, unavailableLabel } from "@/i18n/dynamic";',
              'import { disruptionBody, liveOperatingSummary, markUnavailableLabel, marketScheduleContext, minimumWageLabel, suggestedIncidentPrompt, unavailableLabel } from "@/i18n/dynamic";'
            ),
            (
              'const { state, impact, previewImpact, hydrated, runAction, locale } = useAppState();',
              'const { state, impact, previewImpact, scenarios, hydrated, runAction, locale } = useAppState();'
            ),
            (
              '  const visibleImpact = previewImpact ?? impact;\n  return (',
              '''  const visibleImpact = previewImpact ?? impact;
  const operatingSummary = liveOperatingSummary(locale, {
    activityState: state.activity.state,
    hasIncident: Boolean(state.incident),
    hasPreview: Boolean(state.preview),
    optionCount: scenarios.length,
    uncoveredPeakMinutes: visibleImpact.uncoveredPeakMinutes,
    warningCount: visibleImpact.warnings.length,
    laborRatio: visibleImpact.laborRatio,
    incidentWindow: ui.timeline.fridayGap,
  });
  return ('''
            ),
            (
              'data-market={state.business.market} style={{',
              'data-market={state.business.market} data-operating-tone={operatingSummary.tone} style={{'
            ),
            (
              '<h1>{profile.copy.headline}</h1><p>{marketScheduleContext(locale, profile.copy.scheduleContext, location)}</p>',
              '<h1>{operatingSummary.headline}</h1><p>{operatingSummary.detail}</p>'
            ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected source fragment: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit patch if changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ownerops-app.tsx
          git commit -m "chore: apply live operating summary patch"
          git push origin HEAD:feat/live-operating-summary
