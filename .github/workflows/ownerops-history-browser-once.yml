name: OwnerOps history browser once
on:
  push:
    branches: [re0/ai-store-manager]
    paths: [.github/workflows/ownerops-history-browser-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: re0/ai-store-manager
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Add three-month browser acceptance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/webmcp-browser-e2e.mjs')
          text=p.read_text()
          old='''    step("verify month to week schedule hierarchy");\n    await page.getByTestId("schedule-view-month").click();\n    await page.getByTestId("schedule-month-overview").waitFor({ state: "visible", timeout: 10_000 });\n    await page.locator("[data-testid^=month-week-]").filter({ hasText: /h/ }).first().click();\n\n    step("continue full reviewed-apply flow on Seoul");'''
          new='''    step("verify July-August-September schedule history hierarchy");\n    await page.getByTestId("schedule-view-month").click();\n    await page.getByTestId("schedule-month-overview").waitFor({ state: "visible", timeout: 10_000 });\n\n    await page.getByTestId("schedule-prev-month").click();\n    await page.getByText("DEMO · 실적", { exact: true }).first().waitFor({ state: "visible", timeout: 10_000 });\n    const julyWeek = page.locator("[data-testid^=month-week-]").filter({ hasText: "DEMO · 실적" }).first();\n    await julyWeek.click();\n    await page.getByTestId("schedule-history-mode").waitFor({ state: "visible", timeout: 10_000 });\n    assert((await page.getByTestId("schedule-history-mode").textContent())?.includes("DEMO · 실적"), "July history did not render as demo actual.");\n    const julyShift = page.locator("button.shift-chip").first();\n    await julyShift.waitFor({ state: "visible", timeout: 10_000 });\n    assert((await julyShift.getAttribute("draggable")) === "false", "Historical July shift should be read-only.");\n    await julyShift.click();\n    assert(await page.locator(".shift-editor").count() === 0, "Historical July shift opened an editor.");\n\n    await page.getByTestId("schedule-view-month").click();\n    await page.getByTestId("schedule-next-month").click();\n    await page.getByTestId("schedule-next-month").click();\n    await page.getByText("DEMO · 계획", { exact: true }).first().waitFor({ state: "visible", timeout: 10_000 });\n    const septemberWeek = page.locator("[data-testid^=month-week-]").filter({ hasText: "DEMO · 계획" }).first();\n    await septemberWeek.click();\n    await page.getByTestId("schedule-history-mode").waitFor({ state: "visible", timeout: 10_000 });\n    assert((await page.getByTestId("schedule-history-mode").textContent())?.includes("DEMO · 계획"), "September history did not render as demo plan.");\n    const septemberShift = page.locator("button.shift-chip").first();\n    await septemberShift.waitFor({ state: "visible", timeout: 10_000 });\n    assert((await septemberShift.getAttribute("draggable")) === "false", "Future September shift should be read-only.");\n\n    await page.getByTestId("schedule-view-month").click();\n    await page.getByTestId("schedule-prev-month").click();\n    const currentWeekCard = page.getByTestId("month-week-2026-08-24");\n    await currentWeekCard.waitFor({ state: "visible", timeout: 10_000 });\n    assert((await currentWeekCard.textContent())?.includes("DB"), "Current August week is not marked as DB working state.");\n    await currentWeekCard.click();\n\n    step("continue full reviewed-apply flow on Seoul");'''
          if text.count(old) != 1: raise SystemExit(f'expected month hierarchy anchor once, got {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Verify source
        run: |
          npm ci
          npm test
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit verified browser acceptance
        run: |
          git config user.name "OwnerOps CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ownerops-history-browser-once.yml
          git add scripts/webmcp-browser-e2e.mjs
          git commit -m "test: cover three-month schedule history in browser"
          git push origin HEAD:re0/ai-store-manager
