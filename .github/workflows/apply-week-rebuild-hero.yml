name: Apply and verify week rebuild hero

on:
  push:
    branches:
      - feat/week-rebuild-hero

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/week-rebuild-hero
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused product patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # domain/actions.ts
          p = Path('src/domain/actions.ts')
          s = p.read_text()
          s = s.replace('import { createDemoState } from "./fixtures";\nimport { applyChanges, calculateImpact } from "./impact";\nimport type { AppState, IndustryId, MarketId, StaffingChange, StaffingScenario } from "./model";\n',
          'import { createDemoState } from "./fixtures";\nimport { applyChanges, calculateImpact } from "./impact";\nimport { getIndustryProfile } from "@/industry/profiles";\nimport { getWeekRebuildOptions, type WeekRebuildPriority } from "./rebuild";\nimport type { AppState, CapacityGap, IndustryId, MarketId, PlanKind, StaffingChange, StaffingScenario } from "./model";\n')
          s = s.replace('| { type: "preview_changes"; title: string; changes: StaffingChange[] }', '| { type: "preview_changes"; title: string; changes: StaffingChange[]; planKind?: PlanKind; capacityGap?: CapacityGap | null }')
          s = s.replace('if (changes.length === 0 || changes.length > 3) throw new Error("A staffing preview needs one to three bounded changes.");', 'if (changes.length === 0 || changes.length > 16) throw new Error("A staffing preview needs one to sixteen bounded changes.");')
          s = s.replace('export function getResponseOptions(state: AppState): StaffingScenario[] {', 'function getIncidentResponseOptions(state: AppState): StaffingScenario[] {', 1)
          s = s.replace('        id: `cover-${shift.id}-${worker.id}`,\n        title:', '        id: `cover-${shift.id}-${worker.id}`,\n        kind: "incident_recovery",\n        title:', 1)
          anchor = '''  return candidates\n    .sort((a, b) => a.impact.uncoveredPeakMinutes - b.impact.uncoveredPeakMinutes || a.impact.warnings.length - b.impact.warnings.length || a.impact.payrollDelta - b.impact.payrollDelta || a.impact.scheduleChangeCount - b.impact.scheduleChangeCount)\n    .slice(0, 3);\n}\n\nfunction shiftToDay'''
          replacement = '''  return candidates\n    .sort((a, b) => a.impact.uncoveredPeakMinutes - b.impact.uncoveredPeakMinutes || a.impact.warnings.length - b.impact.warnings.length || a.impact.payrollDelta - b.impact.payrollDelta || a.impact.scheduleChangeCount - b.impact.scheduleChangeCount)\n    .slice(0, 3);\n}\n\nexport type ResponseOptionRequest = {\n  objective?: "incident_recovery" | "rebuild_week";\n  maxWeeklyHours?: number;\n  prioritize?: WeekRebuildPriority;\n  allowCapacityGap?: boolean;\n};\n\nexport function getResponseOptions(state: AppState, request: ResponseOptionRequest = {}): StaffingScenario[] {\n  if (request.objective === "rebuild_week") {\n    return getWeekRebuildOptions(state, {\n      maxWeeklyHours: request.maxWeeklyHours,\n      prioritize: request.prioritize,\n      allowCapacityGap: request.allowCapacityGap,\n    });\n  }\n  return getIncidentResponseOptions(state);\n}\n\nfunction shiftToDay'''
          if anchor not in s: raise SystemExit('response option anchor not found')
          s = s.replace(anchor, replacement, 1)
          old = '''    case "create_schedule_draft":\n      if (action.industry === undefined && action.market === undefined) return state;\n      return createDemoState(action.industry ?? state.business.industry, action.market ?? state.business.market);'''
          new = '''    case "create_schedule_draft": {\n      if (action.industry === undefined && action.market === undefined) return state;\n      const industry = action.industry ?? state.business.industry;\n      const market = action.market ?? state.business.market;\n      if (market !== state.business.market) return createDemoState(industry, market);\n      if (industry === state.business.industry) return state;\n      const profile = getIndustryProfile(industry);\n      return { ...state, business: { ...state.business, industry, name: profile.businessName } };\n    }'''
          if old not in s: raise SystemExit('create draft anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('preview: { id: `preview-${scenario.id}`, version: 1, scenarioId: scenario.id, title: scenario.title, changes: scenario.changes, impact: scenario.impact }, activity: { state: "proposalReady", message: "Agent proposal ready.", detail: `${replacementName} is shown as a preview only. Nothing has been committed.` }',
                        'preview: { id: `preview-${scenario.id}`, version: 1, scenarioId: scenario.id, kind: scenario.kind, title: scenario.title, changes: scenario.changes, impact: scenario.impact, capacityGap: scenario.capacityGap }, activity: { state: "proposalReady", message: "Agent proposal ready.", detail: `${replacementName} is shown as a preview only. Nothing has been committed.`, context: scenario.kind }')
          s = s.replace('preview: { id: `preview-custom-${Date.now()}`, version: 1, scenarioId: "custom", title: action.title, changes: action.changes, impact: calculateImpact(state, proposed) }, activity: { state: "proposalReady", message: "Agent proposal ready.", detail: "Custom staffing change is a preview only. Nothing has been committed." }',
                        'preview: { id: `preview-custom-${Date.now()}`, version: 1, scenarioId: "custom", kind: action.planKind ?? "custom", title: action.title, changes: action.changes, impact: calculateImpact(state, proposed), capacityGap: action.capacityGap }, activity: { state: "proposalReady", message: "Agent proposal ready.", detail: "Staffing plan is a preview only. Nothing has been committed.", context: action.planKind ?? "custom" }')
          s = s.replace('activity: { state: "warning", message: "Coverage gap detected.", detail: `${workerLabel(worker)} is unavailable for the Friday evening shift.` },', 'activity: { state: "warning", message: "Coverage gap detected.", detail: `${workerLabel(worker)} is unavailable for the Friday evening shift.`, context: "incident_recovery" },')
          s = s.replace('activity: { state: "applied", message: "Plan applied.", detail: `${appliedWorkerName} covers the reviewed shift. Preview cleared.` }', 'activity: { state: "applied", message: "Plan applied.", detail: `${appliedWorkerName} covers the reviewed plan. Preview cleared.`, context: state.preview.kind }')
          old_block = '''      const movedTime = action.targetDay ? shiftToDay(current.start, current.end, action.targetDay) : { start: current.start, end: current.end };\n      if (state.preview && state.preview.changes.some((change) => change.shiftId === current.id)) {\n        const currentChange = state.preview.changes.find((change) => change.shiftId === current.id);\n        const previousWorker = state.workers.find((item) => item.id === currentChange?.workerId);\n        const changes = state.preview.changes.map((change) => change.shiftId === current.id ? { ...change, workerId: worker.id, ...movedTime } : change);\n        const proposed = applyChanges(state.shifts, changes);\n        return { ...state, preview: { ...state.preview, version: state.preview.version + 1, title: `${workerLabel(worker)} covers the shift`, changes, impact: calculateImpact(state, proposed) }, activity: { state: "reviewNeeded", message: "Human edit detected.", detail: `${workerLabel(previousWorker, "Proposed replacement")} → ${workerLabel(worker)}; local impact updated. Agent review pending.` } };\n      }'''
          new_block = '''      const candidateCurrent = state.preview ? applyChanges(state.shifts, state.preview.changes).find((item) => item.id === current.id) ?? current : current;\n      const movedTime = action.targetDay ? shiftToDay(candidateCurrent.start, candidateCurrent.end, action.targetDay) : { start: candidateCurrent.start, end: candidateCurrent.end };\n      if (state.preview) {\n        const previousWorker = state.workers.find((item) => item.id === candidateCurrent.workerId);\n        const nextChange = { shiftId: current.id, workerId: worker.id, ...movedTime };\n        const hasExistingChange = state.preview.changes.some((change) => change.shiftId === current.id);\n        const changes = hasExistingChange\n          ? state.preview.changes.map((change) => change.shiftId === current.id ? { ...change, ...nextChange } : change)\n          : [...state.preview.changes, nextChange];\n        validateStaffingChanges(state, changes);\n        const proposed = applyChanges(state.shifts, changes);\n        return { ...state, preview: { ...state.preview, version: state.preview.version + 1, title: state.preview.title, changes, impact: calculateImpact(state, proposed) }, activity: { state: "reviewNeeded", message: "Human edit detected.", detail: `${workerLabel(previousWorker, "Previous assignment")} → ${workerLabel(worker)}; exact candidate updated. Agent review pending.`, context: state.preview.kind } };\n      }'''
          if old_block not in s: raise SystemExit('reassign preview anchor not found')
          s = s.replace(old_block, new_block, 1)
          p.write_text(s)

          # webmcp/register-tools.ts
          p = Path('src/webmcp/register-tools.ts')
          s = p.read_text()
          s = s.replace('import { getResponseOptions, type ApplicationAction } from "@/domain/actions";', 'import { getResponseOptions, type ApplicationAction, type ResponseOptionRequest } from "@/domain/actions";')
          s = s.replace('import type { AppState, IndustryId, MarketId, StaffingChange } from "@/domain/model";', 'import type { AppState, CapacityGap, IndustryId, MarketId, PlanKind, StaffingChange } from "@/domain/model";')
          s = s.replace('    preview: state.preview,\n    metrics:', '    preview: state.preview,\n    planKind: state.preview?.kind ?? state.activity.context ?? null,\n    capacityGap: state.preview?.capacityGap ?? null,\n    metrics:')
          old = '''    getResponseOptions: () => {\n      const options = getResponseOptions(bridge.getState());\n      if (options.length === 3) {\n        bridge.runAction({ type: "set_activity", activity: { state: "proposalReady", message: "Compared three recovery options.", detail: "Three bounded options are ready to preview." } });\n      }\n      return { summary: options.length === 3 ? "Three recovery options are ready." : "No complete three-option set is available for the current incident.", count: options.length, options };\n    },'''
          new = '''    getResponseOptions: (input: ResponseOptionRequest = {}) => {\n      const options = getResponseOptions(bridge.getState(), input);\n      const rebuild = input.objective === "rebuild_week";\n      const recommended = rebuild ? options[0] : undefined;\n      return {\n        summary: rebuild\n          ? options.length > 0 ? `${options.length} deterministic week-rebuild plans are ready. The first matches the requested priority.` : "No week rebuild satisfies the requested constraints with the allowed capacity-gap policy."\n          : options.length === 3 ? "Three recovery options are ready." : "No complete three-option set is available for the current incident.",\n        count: options.length,\n        options,\n        recommendedPreview: recommended ? { planKind: "week_rebuild", title: recommended.title, changes: recommended.changes, capacityGap: recommended.capacityGap ?? null } : null,\n      };\n    },'''
          if old not in s: raise SystemExit('executor response options anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('previewStaffingChange: (input: { scenarioId?: string; title?: string; changes?: StaffingChange[]; uiLocale?: unknown }) => {', 'previewStaffingChange: (input: { scenarioId?: string; title?: string; changes?: StaffingChange[]; planKind?: PlanKind; capacityGap?: CapacityGap | null; uiLocale?: unknown }) => {')
          s = s.replace('bridge.runAction({ type: "preview_changes", title: input.title ?? "Custom staffing change", changes: input.changes ?? [] });', 'bridge.runAction({ type: "preview_changes", title: input.title ?? "Custom staffing change", changes: input.changes ?? [], planKind: input.planKind, capacityGap: input.capacityGap });')
          s = s.replace('bridge.runAction({ type: "set_activity", activity: { state: "reviewed", message: "Agent reviewed live plan.", detail: `${displayName(candidateWorker) ? `${displayName(candidateWorker)} candidate` : "Current schedule"} reviewed from the exact live state. Ready to apply.` } });', 'bridge.runAction({ type: "set_activity", activity: { state: "reviewed", message: "Agent reviewed live plan.", detail: `${state.preview && state.preview.changes.length > 1 ? `${state.preview.changes.length} schedule changes` : displayName(candidateWorker) ? `${displayName(candidateWorker)} candidate` : "Current schedule"} reviewed from the exact live state. Ready to apply.`, context: state.preview?.kind } });')
          s = s.replace('description: "Create or reconfigure the bounded weekly demo schedule. uiLocale MUST match the language of the user\'s latest instruction. industry and market are independent: set market only when the user explicitly identifies a country/city/market or asks for that market\'s wage context; otherwise preserve the current market. Never infer market from language.",', 'description: "Create or reconfigure the bounded weekly demo schedule. uiLocale MUST match the language of the user\'s latest instruction. An industry-only correction preserves the live incident, preview, and schedule. Changing market creates a fresh market-specific demo because worker names, wages, and currency change. Never infer market from language.",')
          old_tool = '''  register(document.modelContext.registerTool({\n    name: "get_response_options",\n    title: "Compare staffing recovery options",\n    description: "Return exactly three deterministic recovery options for the current uncovered incident when the demo fixture supports them. Does not change the committed schedule, UI language, or market.",\n    inputSchema: emptySchema,\n    annotations: { readOnlyHint: true },\n    execute: async () => tools.getResponseOptions(),\n  }, { signal: controller.signal }));'''
          new_tool = '''  register(document.modelContext.registerTool({\n    name: "get_response_options",\n    title: "Generate staffing response plans",\n    description: "Generate deterministic staffing plans without committing anything. Use objective=incident_recovery for the current call-out. Use objective=rebuild_week when the owner asks to optimize, rebuild, reduce labor cost, rebalance hours, or expose missing qualified capacity across the whole week. Week rebuild always preserves the published peak-coverage windows. When the user asked for action rather than explanation only, prefer previewing the first returned plan without asking another permission question because preview is non-committing.",\n    inputSchema: {\n      type: "object",\n      properties: {\n        objective: { type: "string", enum: ["incident_recovery", "rebuild_week"], description: "Planning scope. Defaults to incident_recovery for backward compatibility." },\n        maxWeeklyHours: { type: "number", minimum: 1, maximum: 80, description: "Optional weekly-hour ceiling for rebuild_week; defaults to the configured review threshold." },\n        prioritize: { type: "string", enum: ["cost", "balance", "minimal_changes"], description: "Primary week-rebuild strategy. The tool still returns deterministic alternatives." },\n        allowCapacityGap: { type: "boolean", description: "If true, return the best plan plus an explicit qualified-role capacity gap when the current team cannot satisfy the hour ceiling. Defaults to true." },\n      },\n      additionalProperties: false,\n    },\n    annotations: { readOnlyHint: true },\n    execute: async (input) => tools.getResponseOptions(input as ResponseOptionRequest),\n  }, { signal: controller.signal }));'''
          if old_tool not in s: raise SystemExit('get_response_options tool block not found')
          s = s.replace(old_tool, new_tool, 1)
          s = s.replace('description: "Display a recovery scenario or bounded shift reassignment in the schedule as a candidate preview without committing it. uiLocale MUST match the language of the user\'s latest instruction; market is unchanged.",', 'description: "Display an incident recovery or a bounded full-week rebuild as a candidate preview without committing it. For rebuild_week, pass the recommendedPreview title, changes, planKind, and capacityGap returned by get_response_options. A preview may reshape many shifts at once; the human can still edit the live candidate before agent review.",')
          s = s.replace('changes: { type: "array", maxItems: 3, items:', 'changes: { type: "array", maxItems: 16, items:')
          s = s.replace('        uiLocale: uiLocaleField,\n      },\n      required: ["uiLocale"],\n      anyOf:', '        planKind: { type: "string", enum: ["custom", "week_rebuild"], description: "Set week_rebuild when previewing a full-week plan returned by get_response_options." },\n        capacityGap: { type: "object", properties: { role: { type: "string", enum: ["barista", "manager"] }, hoursPerWeek: { type: "number" }, shiftIds: { type: "array", items: { type: "string" } }, reason: { type: "string" } }, required: ["role", "hoursPerWeek", "shiftIds", "reason"], additionalProperties: false },\n        uiLocale: uiLocaleField,\n      },\n      required: ["uiLocale"],\n      anyOf:', 1)
          s = s.replace('execute: async (input) => tools.previewStaffingChange(input as { scenarioId?: string; title?: string; changes?: StaffingChange[]; uiLocale?: UiLocale }),', 'execute: async (input) => tools.previewStaffingChange(input as { scenarioId?: string; title?: string; changes?: StaffingChange[]; planKind?: PlanKind; capacityGap?: CapacityGap | null; uiLocale?: UiLocale }),')
          p.write_text(s)

          # i18n/dynamic.ts: append tiny localized presentation helpers.
          p = Path('src/i18n/dynamic.ts')
          s = p.read_text()
          marker = 'export function weekRebuildCopy('
          if marker not in s:
            s += '''\n\nexport function weekRebuildCopy(locale: UiLocale, changeCount: number) {\n  switch (locale) {\n    case "ko": return { eyebrow: "주간 운영 재구성", title: "에이전트가 이번 주 운영안을 다시 짰습니다.", body: `${changeCount}개 근무 배정을 한 번에 재구성했습니다. 피크 커버리지는 유지되며 아직 확정되지 않았습니다.` };\n    case "ja": return { eyebrow: "週間オペレーション再構成", title: "エージェントが今週の運用プランを組み直しました。", body: `${changeCount}件のシフト割当を一括で再構成しました。ピーク時のカバレッジは維持され、まだ確定されていません。` };\n    case "es": return { eyebrow: "Reconstrucción semanal", title: "El agente ha reconstruido la operación de esta semana.", body: `Se han reorganizado ${changeCount} asignaciones de turno de una vez. La cobertura punta se mantiene y nada está confirmado todavía.` };\n    case "zh-CN": return { eyebrow: "本周运营重构", title: "智能体已重新构建本周运营方案。", body: `一次重构了 ${changeCount} 个班次分配。高峰覆盖保持不变，当前仍未提交。` };\n    default: return { eyebrow: "Weekly operation rebuild", title: "The agent rebuilt this week's operating plan.", body: `${changeCount} shift assignments were reshaped at once. Peak coverage stays intact and nothing is committed yet.` };\n  }\n}\n\nexport function capacityGapCopy(locale: UiLocale, roleLabel: string, hoursPerWeek: number) {\n  switch (locale) {\n    case "ko": return { eyebrow: "필요 인력", title: `${roleLabel} · 주 ${hoursPerWeek}시간`, detail: "현재 팀만으로는 설정한 주간 시간 제한과 역할 커버리지를 동시에 만족할 수 없습니다." };\n    case "ja": return { eyebrow: "必要な人員", title: `${roleLabel} · 週${hoursPerWeek}時間`, detail: "現在のチームだけでは、設定した週間時間上限と役割カバレッジを同時に満たせません。" };\n    case "es": return { eyebrow: "Capacidad necesaria", title: `${roleLabel} · ${hoursPerWeek} h/semana`, detail: "El equipo actual no puede cumplir a la vez el límite semanal configurado y la cobertura del rol." };\n    case "zh-CN": return { eyebrow: "所需人力", title: `${roleLabel} · 每周 ${hoursPerWeek} 小时`, detail: "仅靠当前团队无法同时满足设定的每周工时上限和角色覆盖要求。" };\n    default: return { eyebrow: "Capacity needed", title: `${roleLabel} · ${hoursPerWeek} h/week`, detail: "The current team cannot satisfy the configured weekly-hour limit and required role coverage at the same time." };\n  }\n}\n\nexport function weekRebuildTimelineCopy(locale: UiLocale) {\n  switch (locale) {\n    case "ko": return { label: "주간 운영안 재구성", detail: "비용 · 근무시간 · 역할 · 피크 커버리지 동시 검토" };\n    case "ja": return { label: "週間プランを再構成", detail: "コスト・勤務時間・役割・ピークカバレッジを同時に確認" };\n    case "es": return { label: "Reconstruir la semana", detail: "Coste · horas · roles · cobertura punta revisados juntos" };\n    case "zh-CN": return { label: "重构本周方案", detail: "同时检查成本 · 工时 · 角色 · 高峰覆盖" };\n    default: return { label: "Rebuild weekly plan", detail: "Cost · hours · roles · peak coverage checked together" };\n  }\n}\n'''
          p.write_text(s)

          # components/ownerops-app.tsx
          p = Path('src/components/ownerops-app.tsx')
          s = p.read_text()
          s = s.replace('import { disruptionBody, getOutreachCopy, liveOperatingSummary, markUnavailableLabel, marketScheduleContext, minimumWageLabel, outreachDraft, suggestedIncidentPrompt, unavailableLabel } from "@/i18n/dynamic";', 'import { capacityGapCopy, disruptionBody, getOutreachCopy, liveOperatingSummary, markUnavailableLabel, marketScheduleContext, minimumWageLabel, outreachDraft, suggestedIncidentPrompt, unavailableLabel, weekRebuildCopy, weekRebuildTimelineCopy } from "@/i18n/dynamic";')
          s = s.replace('  const activity = ui.activity[state.activity.state];\n  const showAvatarCallout', '  const activity = ui.activity[state.activity.state];\n  const weekRebuild = state.preview?.kind === "week_rebuild" || state.activity.context === "week_rebuild";\n  const activeCapacityGap = state.preview?.capacityGap ?? null;\n  const rebuildTimeline = weekRebuildTimelineCopy(locale);\n  const multiChangePreview = Boolean(state.preview && state.preview.changes.length > 1);\n  const showAvatarCallout')
          timeline_match = re.search(r'  const timeline = \[\n.*?\n  \];\n  return \(', s, flags=re.S)
          if not timeline_match: raise SystemExit('timeline block not found')
          existing = timeline_match.group(0)
          existing_array = existing[len('  const timeline = '):existing.rfind('\n  return (')]
          week_array = '''weekRebuild ? [\n    { label: ui.timeline.readLive, detail: ui.timeline.canonicalLoaded, status: "complete" as TimelineStatus },\n    { label: rebuildTimeline.label, detail: rebuildTimeline.detail, status: hasProposal ? "complete" as TimelineStatus : "active" as TimelineStatus },\n    { label: ui.timeline.proposal, detail: state.preview ? `${state.preview.changes.length} ${ui.scenario.changes}` : ui.timeline.chooseOption, status: hasProposal ? "complete" as TimelineStatus : "pending" as TimelineStatus },\n    { label: ui.timeline.humanReview, detail: applied || reviewed ? ui.timeline.editInReviewedPlan : needsReview ? ui.timeline.reviewPending : state.preview ? ui.timeline.waitingEdit : ui.timeline.editUncommitted, status: applied || reviewed ? "complete" as TimelineStatus : needsReview || state.preview ? "active" as TimelineStatus : "pending" as TimelineStatus },\n    { label: ui.timeline.agentReview, detail: applied || reviewed ? ui.timeline.exactRecalculated : needsReview ? ui.timeline.evaluateNext : ui.timeline.runsAfterEdit, status: applied || reviewed ? "complete" as TimelineStatus : needsReview ? "active" as TimelineStatus : "pending" as TimelineStatus },\n    { label: ui.timeline.applyReviewed, detail: applied ? ui.timeline.committed : reviewed ? ui.timeline.readyToApply : ui.timeline.onlyAfterReview, status: applied ? "complete" as TimelineStatus : reviewed ? "active" as TimelineStatus : "pending" as TimelineStatus },\n  ] : ''' + existing_array
          s = s[:timeline_match.start()] + '  const timeline = ' + week_array + '\n  return (' + s[timeline_match.end():]
          s = s.replace('<h3>{candidate.label}</h3>', '<h3>{multiChangePreview && state.preview ? `${state.preview.changes.length} ${ui.scenario.changes}` : candidate.label}</h3>')
          s = s.replace('<div><span>{ui.rail.weeklyHours}</span><strong>{candidateHours} h</strong></div>', '<div><span>{multiChangePreview ? ui.scenario.changes : ui.rail.weeklyHours}</span><strong>{multiChangePreview ? visibleImpact.scheduleChangeCount : `${candidateHours} h`}</strong></div>')
          candidate_end = '''      </section>}\n      {needsReview && <div className="agent-prompt">'''
          capacity_insert = '''      </section>}\n      {activeCapacityGap && (() => { const gapCopy = capacityGapCopy(locale, profile.roleLabels[activeCapacityGap.role], activeCapacityGap.hoursPerWeek); return <section className="capacity-gap-card" aria-label={gapCopy.eyebrow}><span className="activity-kicker">{gapCopy.eyebrow}</span><h3>{gapCopy.title}</h3><p>{gapCopy.detail}</p></section>; })()}\n      {needsReview && <div className="agent-prompt">'''
          if candidate_end not in s: raise SystemExit('candidate end anchor not found')
          s = s.replace(candidate_end, capacity_insert, 1)
          old_no_incident = '''  if (!state.incident) {\n    return <section className="scenario-panel pre-incident"><div><span className="eyebrow">{profile.copy.incidentLabel} · {ui.scenario.canonicalDisruption}</span><h2>{profile.copy.disruptionTitle}</h2><p>{disruptionBody(locale, incidentWorker?.name ?? "Minsoo")}</p></div><button className="danger-soft" onClick={() => runAction({ type: "mark_unavailable", workerId: "minsoo", shiftId: "fri-minsoo-18", reason: "Last-minute absence" })}><Icon name="alert"/>{markUnavailableLabel(locale, incidentWorker?.name ?? "Minsoo")}</button></section>;\n  }'''
          new_no_incident = '''  if (!state.incident) {\n    if (state.preview?.kind === "week_rebuild") {\n      const rebuild = weekRebuildCopy(locale, state.preview.changes.length);\n      return <section className="scenario-panel week-rebuild-summary"><div><span className="eyebrow">{rebuild.eyebrow}</span><h2>{rebuild.title}</h2><p>{rebuild.body}</p></div><div className="rebuild-stats"><strong>{state.preview.changes.length} {ui.scenario.changes}</strong><span>{state.preview.impact.uncoveredPeakMinutes ? `${state.preview.impact.uncoveredPeakMinutes} ${ui.rail.minutesGap}` : ui.preview.covered}</span></div></section>;\n    }\n    return <section className="scenario-panel pre-incident"><div><span className="eyebrow">{profile.copy.incidentLabel} · {ui.scenario.canonicalDisruption}</span><h2>{profile.copy.disruptionTitle}</h2><p>{disruptionBody(locale, incidentWorker?.name ?? "Minsoo")}</p></div><button className="danger-soft" onClick={() => runAction({ type: "mark_unavailable", workerId: "minsoo", shiftId: "fri-minsoo-18", reason: "Last-minute absence" })}><Icon name="alert"/>{markUnavailableLabel(locale, incidentWorker?.name ?? "Minsoo")}</button></section>;\n  }'''
          if old_no_incident not in s: raise SystemExit('scenario no incident anchor not found')
          s = s.replace(old_no_incident, new_no_incident, 1)
          p.write_text(s)

          # presentation-only CSS
          p = Path('src/styles/locale-timeline.css')
          s = p.read_text()
          marker = '/* Full-week rebuild hero. */'
          if marker not in s:
            s += '''\n\n/* Full-week rebuild hero. */\n.week-rebuild-summary { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px 20px; border-color: color-mix(in srgb, var(--oo-accent) 28%, var(--oo-border)); background: linear-gradient(120deg, color-mix(in srgb, var(--oo-accent-soft) 72%, var(--oo-surface)), var(--oo-surface)); }\n.week-rebuild-summary h2 { margin-top: 4px; font-size: 18px; }\n.week-rebuild-summary p { max-width: 720px; margin-top: 5px; color: var(--oo-secondary-ink); font-size: 11px; line-height: 1.45; }\n.rebuild-stats { display: grid; gap: 4px; min-width: 120px; text-align: right; }\n.rebuild-stats strong { color: var(--oo-accent); font-size: 18px; }\n.rebuild-stats span { color: var(--secondary); font-size: 10px; }\n.capacity-gap-card { margin-top: 12px; padding: 12px 13px; border: 1px solid #e4c7a2; border-radius: var(--oo-radius-card); background: #fffaf2; }\n.capacity-gap-card .activity-kicker { color: #a2652f; }\n.capacity-gap-card h3 { margin: 3px 0 0; font-size: 13px; }\n.capacity-gap-card p { margin-top: 5px; color: var(--secondary); font-size: 10px; line-height: 1.45; }\n.shift-chip.preview { will-change: transform, opacity; }\n@media (max-width: 900px) { .week-rebuild-summary { align-items: flex-start; flex-direction: column; } .rebuild-stats { text-align: left; } }\n'''
          p.write_text(s)

          # tests/domain.test.ts
          p = Path('tests/domain.test.ts')
          s = p.read_text()
          anchor = '''  it("keeps preview separate until matching id and version are applied", () => {'''
          tests = '''  it("rebuilds the full week with many changes and exposes qualified capacity", () => {\n    const state = createDemoState("sushi", "jp-tokyo");\n    const options = getResponseOptions(state, { objective: "rebuild_week", maxWeeklyHours: 40, prioritize: "cost", allowCapacityGap: true });\n    expect(options).toHaveLength(3);\n    expect(options[0].kind).toBe("week_rebuild");\n    expect(options[0].changes.length).toBeGreaterThan(3);\n    expect(options[0].impact.payrollDelta).toBeLessThan(0);\n    expect(options[0].impact.uncoveredPeakMinutes).toBe(0);\n    expect(options[0].capacityGap).toMatchObject({ role: "manager", hoursPerWeek: 8 });\n  });\n\n  it("preserves live work when only the industry is corrected but resets on market change", () => {\n    let state = dispatchApplicationAction(createDemoState("pizza", "jp-tokyo"), { type: "mark_unavailable", workerId: "minsoo", shiftId: "fri-minsoo-18" });\n    const scenario = getResponseOptions(state)[0];\n    state = dispatchApplicationAction(state, { type: "preview_scenario", scenarioId: scenario.id });\n    const previewId = state.preview?.id;\n    state = dispatchApplicationAction(state, { type: "create_schedule_draft", preset: "demo", industry: "sushi" });\n    expect(state.business.industry).toBe("sushi");\n    expect(state.business.market).toBe("jp-tokyo");\n    expect(state.incident?.workerId).toBe("minsoo");\n    expect(state.preview?.id).toBe(previewId);\n    state = dispatchApplicationAction(state, { type: "create_schedule_draft", preset: "demo", market: "us-nyc" });\n    expect(state.business.market).toBe("us-nyc");\n    expect(state.incident).toBeNull();\n    expect(state.preview).toBeNull();\n    expect(state.workers.find((worker) => worker.id === "minsoo")?.name).toBe("Mason");\n  });\n\n'''
          if anchor not in s: raise SystemExit('domain test anchor not found')
          s = s.replace(anchor, tests + anchor, 1)
          p.write_text(s)

          # tests/integration.test.ts
          p = Path('tests/integration.test.ts')
          s = p.read_text()
          anchor = '''  it("registers the exact eight-tool WebMCP contract with JSON Schemas", async () => {'''
          tests = '''  it("lets WebMCP rebuild a full week, preview many shifts, and keep a new human edit inside the candidate", () => {\n    const web = bridge(createDemoState("sushi", "jp-tokyo"));\n    const executors = createToolExecutors(web);\n    const result = executors.getResponseOptions({ objective: "rebuild_week", maxWeeklyHours: 40, prioritize: "cost", allowCapacityGap: true });\n    expect(result.count).toBe(3);\n    expect(result.recommendedPreview?.changes.length).toBeGreaterThan(3);\n    expect(result.recommendedPreview?.capacityGap).toMatchObject({ role: "manager", hoursPerWeek: 8 });\n    const preview = executors.previewStaffingChange({ ...result.recommendedPreview!, uiLocale: "ko" });\n    expect(preview.preview?.kind).toBe("week_rebuild");\n    expect(preview.preview?.changes.length).toBeGreaterThan(3);\n    const untouched = web.getState().shifts.find((shift) => !preview.preview?.changes.some((change) => change.shiftId === shift.id) && shift.role === "barista")!;\n    const replacement = web.getState().workers.find((worker) => worker.role === "barista" && worker.id !== untouched.workerId)!;\n    const committedBefore = web.getState().shifts.find((shift) => shift.id === untouched.id)?.workerId;\n    web.runAction({ type: "reassign_shift", shiftId: untouched.id, workerId: replacement.id });\n    expect(web.getState().activity.state).toBe("reviewNeeded");\n    expect(web.getState().preview?.changes.some((change) => change.shiftId === untouched.id && change.workerId === replacement.id)).toBe(true);\n    expect(web.getState().shifts.find((shift) => shift.id === untouched.id)?.workerId).toBe(committedBefore);\n    const reviewed = executors.evaluateCurrentPlan();\n    expect(reviewed.impact.scheduleChangeCount).toBeGreaterThan(3);\n    expect(web.getState().activity.context).toBe("week_rebuild");\n  });\n\n'''
          if anchor not in s: raise SystemExit('integration test anchor not found')
          s = s.replace(anchor, tests + anchor, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm test
