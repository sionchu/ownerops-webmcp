      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Commit verified product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/actions.ts src/webmcp/register-tools.ts src/i18n/dynamic.ts src/components/ownerops-app.tsx src/styles/locale-timeline.css tests/domain.test.ts tests/integration.test.ts
          git commit -m "feat: let agents rebuild the operating week"
          git push origin HEAD:feat/week-rebuild-hero
